<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GarageLM</title>
<style>
  :root { color-scheme: light dark;
    --bg: #f6f6f4; --fg: #1c1c1a; --card: #ffffff; --muted: #8a8a86;
    --user: #dbeafe; --accent: #2563eb; --border: #e4e4e0; }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #16161a; --fg: #e8e8e4; --card: #232328; --muted: #8a8a92;
    --user: #1e3a5f; --accent: #60a5fa; --border: #2e2e34; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); height: 100dvh;
    display: flex; flex-direction: column;
    font: 15px/1.55 -apple-system, system-ui, sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 16px; }
  header .sub, #stats { color: var(--muted); font-size: 12px; }
  #stats { margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72ch; padding: 9px 13px; border-radius: 12px;
    white-space: pre-wrap; overflow-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; }
  .assistant { background: var(--card); border: 1px solid var(--border);
    align-self: flex-start; }
  .assistant:empty::after { content: "…"; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 18px 16px;
    border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--fg); font: inherit; height: 42px; }
  button { padding: 0 18px; border: 0; border-radius: 10px; font: inherit;
    background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #clear { background: transparent; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>GarageLM</h1><span class="sub" id="model">loading…</span>
  <span id="stats"></span>
  <button id="clear" type="button" title="clear conversation">clear</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="Message the model — Enter to send, Shift+Enter for newline" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      form = document.getElementById("form"), sendBtn = document.getElementById("send"),
      stats = document.getElementById("stats");
let messages = [], busy = false;

fetch("/v1/models").then(r => r.json())
  .then(d => document.getElementById("model").textContent = d.data[0].id)
  .catch(() => document.getElementById("model").textContent = "server unreachable");

function bubble(role) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  log.appendChild(el);
  return el;
}
function scrollDown() { log.scrollTop = log.scrollHeight; }

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  messages.push({ role: "user", content: text });
  bubble("user").textContent = text;
  input.value = "";
  const out = bubble("assistant");
  scrollDown();
  const t0 = performance.now();
  let content = "", chunks = 0;
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, stream: true, max_tokens: 512 }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split("\n\n"); buf = events.pop();
      for (const ev of events) {
        if (!ev.startsWith("data: ") || ev.includes("[DONE]")) continue;
        const delta = JSON.parse(ev.slice(6)).choices[0].delta.content;
        if (delta) { content += delta; chunks++; out.textContent = content; scrollDown(); }
      }
    }
    messages.push({ role: "assistant", content });
    const secs = (performance.now() - t0) / 1000;
    stats.textContent = `${chunks} tok · ${(chunks / secs).toFixed(1)} tok/s`;
  } catch (e) {
    out.textContent = content + "  ⚠ " + e.message;
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

form.addEventListener("submit", e => { e.preventDefault(); send(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("clear").addEventListener("click", () => {
  messages = []; log.innerHTML = ""; stats.textContent = ""; input.focus();
});
</script>
</body>
</html>
